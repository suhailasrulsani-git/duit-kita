<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duit Kita</title>
<meta name="description" content="Family money: salary, commitments, spending, budget and savings goals.">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duit Kita">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6f5; --card: #fff; --ink: #1c2321; --muted: #66706d; --line: #e2e7e5;
    --brand: #0f766e; --brand-ink: #fff; --soft: #e6f2f0; --bar: #e9eeec;
    --good: #15803d; --warn: #b45309; --bad: #b91c1c; --note-bg: #fff4d6; --note-ink: #7a4d00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1413; --card: #18201e; --ink: #e7ecea; --muted: #9aa5a1; --line: #29332f;
      --brand: #2dd4bf; --brand-ink: #04211d; --soft: #14302b; --bar: #25302c;
      --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --note-bg: #3a2e10; --note-ink: #fcd98a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--brand); }
  [hidden] { display: none !important; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .top h1 { font-size: 18px; margin: 0; flex: 1; }
  .me { font-size: 13px; color: var(--muted); }
  .banner { margin: 0 16px 8px; padding: 8px 12px; border-radius: 10px; background: var(--note-bg); color: var(--note-ink); font-size: 13px; }

  .monthbar { display: flex; align-items: center; justify-content: space-between; margin: 4px 16px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .monthbar > button { border: 0; background: none; width: 44px; height: 40px; border-radius: 9px; font-size: 22px; line-height: 1; cursor: pointer; }
  .monthbar .mid { text-align: center; }
  .monthbar .mid b { display: block; }
  .link { border: 0; background: none; color: var(--brand); font-size: 12px; padding: 0; cursor: pointer; }

  main { padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card.hint { background: var(--soft); border-color: transparent; }
  .label { color: var(--muted); font-size: 13px; }
  .big { font-size: 32px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0 8px; overflow-wrap: anywhere; }
  .split { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .split b { color: var(--ink); }
  .tbl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  .tbl th { text-align: right; font-size: 14px; padding: 0 0 6px 6px; overflow-wrap: anywhere; }
  .tbl td { text-align: right; padding: 3px 0 3px 6px; font-weight: 700; white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { width: 31%; text-align: left; padding-left: 0; color: var(--muted); font-weight: 400; }
  .tbl tr.total td { border-top: 1px solid var(--line); padding-top: 7px; font-size: 14px; }
  .tbl td.neg { color: var(--bad); }
  h3 { font-size: 15px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
  .row span { color: var(--muted); }
  .row b { white-space: nowrap; }
  .row.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; font-size: 14px; }
  .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
  .neg, .row b.neg { color: var(--bad); }
  .muted { color: var(--muted); font-size: 13px; }
  small.inline { display: inline; color: var(--muted); font-weight: 400; font-size: 12px; }

  .bar { height: 8px; border-radius: 99px; background: var(--bar); overflow: hidden; margin: 8px 0 4px; width: 100%; }
  .bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
  .bar i.warn { background: var(--warn); }
  .bar i.bad { background: var(--bad); }
  .bar i.goal { background: var(--brand); }

  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.danger { color: var(--bad); }
  .btn.wide { width: 100%; margin-bottom: 12px; }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }

  .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; }
  .item.col { flex-direction: column; align-items: stretch; gap: 0; }
  .card > .item:first-child, .day + .item { border-top: 0; }
  .item > span:first-child { min-width: 0; }
  .item small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .item .amt { font-weight: 700; white-space: nowrap; }
  .day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 10px 0 0; }
  .card > .day:first-child { margin-top: 0; }
  .empty { color: var(--muted); text-align: center; padding: 14px 8px; margin: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px; white-space: nowrap; cursor: pointer; min-height: 36px; }
  .chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

  .fc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 4px 0 10px; }
  .fc div { background: var(--soft); border-radius: 10px; padding: 10px 4px; min-width: 0; }
  .fc small { display: block; color: var(--muted); font-size: 12px; }
  .fc b { font-size: 14px; overflow-wrap: anywhere; }
  .goal-time { font-size: 13px; margin: 6px 0 8px; }
  .adds { margin-bottom: 8px; }
  .adds .row button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 32px; height: 28px; font-size: 18px; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  .tabs .in { display: flex; max-width: 560px; margin: 0 auto; }
  .tabs button { flex: 1; border: 0; background: none; padding: 8px 0 10px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-height: 56px; min-width: 0; }
  .tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button.on { color: var(--brand); font-weight: 700; }

  .sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .panel { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  .panel h2 { margin: 0 0 10px; font-size: 18px; }
  .panel label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .panel input, .panel select { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); font-size: 16px; }
  .note { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .err { color: var(--bad); font-size: 13px; min-height: 1em; margin: 8px 0 0; }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .actions .sp { flex: 1; }

  .screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; z-index: 30; }
  .screen h1, .screen h2 { margin: 0; }
  .screen img { border-radius: 18px; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1c2321; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">RM</div>
    <h1>Duit Kita</h1>
    <span class="me" id="meName"></span>
  </header>
  <div class="banner" id="banner" hidden>Demo mode: data stays on this phone only. Fill in firebase-config.js to share it with your family.</div>
  <div class="monthbar" id="monthbar">
    <button data-act="month" data-id="-1" aria-label="Previous month">&lsaquo;</button>
    <div class="mid"><b id="mLabel"></b><button class="link" id="mNow" data-act="month" data-id="0">Back to this month</button></div>
    <button data-act="month" data-id="1" aria-label="Next month">&rsaquo;</button>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-act="tab" data-id="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-id="spend"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>Spend</button>
  <button data-act="tab" data-id="budget"><svg viewBox="0 0 24 24"><path d="M11 3.1A9 9 0 1 0 20.9 13H11z"/><path d="M14 3.5A9 9 0 0 1 20.5 10H14z"/></svg>Budget</button>
  <button data-act="tab" data-id="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  <button data-act="tab" data-id="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6A5 5 0 0 1 21.5 20"/></svg>People</button>
</div></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="screen" id="screen" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="firebase-config.js"></script>
<script>
'use strict';

// ---------- small helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const MONEY = new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR' });
const MONEY0 = new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
const rm = n => MONEY.format(n || 0);
const rm0 = n => MONEY0.format(n || 0);
const num = v => { const n = Math.round(parseFloat(String(v ?? '').replace(/[,\s]/g, '')) * 100) / 100; return isFinite(n) ? n : NaN; };
const sum = (list, f) => Math.round(list.reduce((t, x) => t + (+f(x) || 0), 0) * 100) / 100;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
const addM = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthName = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-MY', { month: 'short', year: 'numeric' }); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const firstName = n => String(n || '').trim().split(/\s+/)[0];
const cls = n => n < 0 ? 'neg' : '';

function dayName(d) {
  if (d === today()) return 'Today';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (d === ymd(y)) return 'Yesterday';
  const [a, b, c] = d.split('-').map(Number);
  return new Date(a, b - 1, c).toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric', month: 'short' });
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
// writes are not awaited: Firestore shows the change at once and syncs when online
const put = p => Promise.resolve(p).catch(e => toast('Not saved: ' + ((e && (e.code || e.message)) || e)));

// ---------- data stores ----------
// Collections under households/main: members, categories, commitments, spending, goals, goalAdds

// Demo store: this phone only. Used while firebase-config.js still has the PASTE values.
function demoStore() {
  const KEY = 'duitkita.demo.v1';
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch { }
  if (!db || typeof db !== 'object') db = { members: { 'suhail@demo': { name: 'Suhail', email: 'suhail@demo' }, 'wife@demo': { name: 'Wife', email: 'wife@demo' } } };
  const watchers = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { } };
  const list = (name, where) => Object.entries(db[name] || {}).map(([id, d]) => ({ id, ...d }))
    .filter(d => !where || (where[1] === '>=' ? d[where[0]] >= where[2] : d[where[0]] === where[2]));
  const fire = name => setTimeout(() => watchers.filter(w => w.name === name).forEach(w => w.cb(list(name, w.where), false)), 0);
  const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return {
    live: false,
    onUser(cb) { setTimeout(() => cb({ email: 'suhail@demo', displayName: 'Suhail' }), 0); },
    async signIn() { },
    async signOut() { },
    watch(name, where, cb) {
      const w = { name, where, cb };
      watchers.push(w);
      setTimeout(() => watchers.includes(w) && cb(list(name, where), false), 0);
      return () => { const i = watchers.indexOf(w); if (i >= 0) watchers.splice(i, 1); };
    },
    async add(name, data) { (db[name] ||= {})[newId()] = JSON.parse(JSON.stringify(data)); save(); fire(name); },
    async set(name, id, data) { const c = (db[name] ||= {}); c[id] = merge(c[id] || {}, JSON.parse(JSON.stringify(data))); save(); fire(name); },
    async del(name, id) { if (db[name]) delete db[name][id]; save(); fire(name); },
    reset() { try { localStorage.removeItem(KEY); } catch { } location.reload(); }
  };
}

// Firebase store: shared live between both phones. Google sign-in; Firestore rules decide who gets in.
const FIREBASE_VER = '10.14.1';
async function firebaseStore(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/`;
  const [{ initializeApp }, A, F] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(`${base}firebase-${n}.js`)));
  const app = initializeApp(cfg), auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { db = F.getFirestore(app); }
  const col = name => F.collection(db, 'households', 'main', name);
  return {
    live: true,
    onUser: cb => A.onAuthStateChanged(auth, cb),
    async signIn() {
      const p = new A.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      try { await A.signInWithPopup(auth, p); }
      catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return A.signInWithRedirect(auth, p);
        if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') throw e;
      }
    },
    signOut: () => A.signOut(auth),
    watch(name, where, cb, onErr, meta) {
      const q = where ? F.query(col(name), F.where(...where)) : col(name);
      return F.onSnapshot(q, { includeMetadataChanges: !!meta }, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), s.metadata.fromCache), onErr);
    },
    add: (name, data) => F.addDoc(col(name), data),
    set: (name, id, data) => F.setDoc(F.doc(col(name), id), data, { merge: true }),
    del: (name, id) => F.deleteDoc(F.doc(col(name), id))
  };
}

// ---------- state ----------
const LISTS = ['members', 'categories', 'commitments', 'goals', 'goalAdds'];
const S = {
  store: null, user: null, me: '', month: thisMonth(), tab: 'home', who: 'all', lastCat: '',
  members: [], categories: [], commitments: [], spending: [], goals: [], goalAdds: [],
  unsub: [], unsubSpend: null, spendFrom: ''
};

function onErr(e) {
  if (e && e.code === 'permission-denied') return screen('blocked');
  toast('Sync problem: ' + ((e && e.message) || e));
}

function startWatch() {
  for (const name of LISTS)
    S.unsub.push(S.store.watch(name, null, (docs, fromCache) => {
      S[name] = docs;
      // first sign-in: add this person (the server copy decides, not an empty phone cache)
      if (name === 'members' && !fromCache && !docs.some(d => d.id === S.me))
        put(S.store.set('members', S.me, { email: S.me, name: firstName(S.user.displayName) || S.me.split('@')[0] }));
      later();
    }, onErr, name === 'members'));
  watchSpending();
}

// spending is the only list that keeps growing: load from the viewed month or 3 months back (for the forecast)
function watchSpending() {
  const from = [S.month, addM(thisMonth(), -3)].sort()[0];
  if (S.unsubSpend && S.spendFrom <= from) return;
  if (S.unsubSpend) S.unsubSpend();
  S.spendFrom = from;
  S.unsubSpend = S.store.watch('spending', ['month', '>=', from], docs => { S.spending = docs; later(); }, onErr);
}

function stopWatch() {
  S.unsub.forEach(u => u()); S.unsub = [];
  if (S.unsubSpend) S.unsubSpend();
  S.unsubSpend = null; S.spendFrom = '';
  for (const name of [...LISTS, 'spending']) S[name] = [];
}

// ---------- sums ----------
const membersSorted = () => [...S.members].sort((a, b) => (b.id === S.me) - (a.id === S.me) || String(a.name).localeCompare(String(b.name)));
const nameOf = id => { const m = S.members.find(x => x.id === id); return m ? (m.name || m.email || id) : id === S.me ? (firstName(S.user && S.user.displayName) || id) : 'Removed person'; };
const memberOpts = () => { const o = membersSorted().map(m => [m.id, m.name || m.id]); return o.length ? o : [[S.me, nameOf(S.me)]]; };
const catsSorted = () => [...S.categories].sort((a, b) => String(a.name).localeCompare(String(b.name)));
const catOf = id => (S.categories.find(c => c.id === id) || {}).name || 'Removed category';

// salary: the latest amount set on or before month m
const salaryKey = (p, m) => Object.keys(p.salaries || {}).filter(k => k <= m).sort().pop();
const salaryIn = (p, m) => { const k = salaryKey(p, m); return k ? +p.salaries[k] || 0 : 0; };
const incomeIn = (m, who) => sum(S.members.filter(p => !who || p.id === who), p => salaryIn(p, m));
// commitments repeat every month from "from" until "to" (both included; empty "to" = still running)
const commitsIn = (m, who) => S.commitments.filter(c => (!who || c.who === who) && c.from <= m && (!c.to || c.to >= m));
const commitIn = (m, who) => sum(commitsIn(m, who), c => c.amount);
const spentIn = (m, who) => sum(S.spending.filter(s => s.month === m && (!who || s.who === who)), s => s.amount);
const catSpent = (id, m) => sum(S.spending.filter(s => s.month === m && s.cat === id), s => s.amount);
const goalSaved = g => Math.round(((+g.start || 0) + sum(S.goalAdds.filter(a => a.goal === g.id), a => a.amount)) * 100) / 100;

// usual monthly spending: average of the last 3 full months that have spending, else the budget, else this month so far
function usualSpend() {
  const cur = thisMonth();
  const past = [1, 2, 3].map(k => spentIn(addM(cur, -k))).filter(t => t > 0);
  if (past.length) return { amt: sum(past, x => x) / past.length, why: past.length === 1 ? 'last month' : `average of the last ${past.length} months` };
  const budget = sum(S.categories, c => c.limit);
  if (budget > 0) return { amt: budget, why: 'your monthly budget' };
  return { amt: spentIn(cur), why: 'this month so far' };
}

// forecast counts the next N months, each one with its own salary and commitments
function forecast() {
  const cur = thisMonth(), u = usualSpend(), next = addM(cur, 1);
  const saving = m => incomeIn(m) - commitIn(m) - u.amt;
  const total = n => { let t = 0; for (let k = 1; k <= n; k++) t += saving(addM(cur, k)); return t; };
  return { u, inc: incomeIn(next), com: commitIn(next), monthly: saving(next), in3: total(3), in6: total(6), in12: total(12) };
}

function goalInfo(g, familyMonthly) {
  const saved = goalSaved(g), target = +g.target || 0, left = Math.max(0, Math.round((target - saved) * 100) / 100);
  let time;
  if (left <= 0) time = 'Goal reached 🎉';
  else if (g.monthly > 0) { const n = Math.ceil(left / g.monthly); time = `About ${plural(n, 'month')} to go, by ${monthName(addM(thisMonth(), n))}, saving ${rm(g.monthly)} a month.`; }
  else if (familyMonthly > 0) { const n = Math.ceil(left / familyMonthly); time = `Set a monthly amount to plan. If all family savings (${rm(familyMonthly)} a month) go here: about ${plural(n, 'month')}.`; }
  else time = 'Set a monthly amount to see how long it takes.';
  return { saved, target, left, time };
}

function bar(v, max, kind) {
  const pct = max > 0 ? Math.min(100, v / max * 100) : 0;
  const c = kind || (v > max ? 'bad' : pct >= 80 ? 'warn' : '');
  return `<div class="bar"><i class="${c}" style="width:${pct.toFixed(1)}%"></i></div>`;
}

  const ppl = membersSorted().map(p => ({ p, i: incomeIn(m, p.id), c: commitIn(m, p.id), s: spentIn(m, p.id) }));
  const cells = f => ppl.map(x => `<td class="${cls(f(x))}">${rm(f(x))}</td>`).join('');

  const limited = S.categories.filter(c => c.limit > 0);
  const lim = sum(limited, c => c.limit), used = sum(limited, c => catSpent(c.id, m));

      <p class="muted" style="margin:0">About <b>${rm(f.monthly)}</b> a month: salary ${rm(f.inc)} − commitments ${rm(f.com)} − usual spending ${rm(f.u.amt)} (${esc(f.u.why)}). Counted from next month.</p></section>`;

function viewSpend() {

// ---------- forms (bottom sheet) ----------
// fields: { k, label, type: text|money|select|date|month|email, value, options: [[value, label]], req, ph }
function sheet(o) {
  const box = $('#sheet');
  const types = { text: 'type="text"', money: 'type="text" inputmode="decimal"', date: 'type="date"', month: 'type="month"', email: 'type="email" inputmode="email" autocapitalize="off"' };
  const field = f => {
    const id = 'f_' + f.k, val = f.value ?? '';
    const input = f.type === 'select'
      ? `<select id="${id}" name="${f.k}">${f.options.map(([v, n]) => `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>`
      : `<input id="${id}" name="${f.k}" ${types[f.type]} value="${esc(val)}" autocomplete="off"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>`;
    return `<label for="${id}">${esc(f.label)}</label>${input}`;
  };
  box.innerHTML = `<form class="panel" novalidate><h2>${esc(o.title)}</h2>${o.note ? `<p class="note">${esc(o.note)}</p>` : ''}${o.fields.map(field).join('')}
    <p class="err"></p><div class="actions">${o.del ? `<button type="button" class="btn danger" data-sheet="del">${esc(o.delLabel || 'Delete')}</button>` : ''}<span class="sp"></span><button type="button" class="btn" data-sheet="close">Cancel</button><button class="btn primary">Save</button></div></form>`;
  box.hidden = false;
  const form = box.firstElementChild, err = form.querySelector('.err');
  const close = () => { box.hidden = true; box.innerHTML = ''; };
  const fail = (msg, el) => { err.textContent = msg; if (el) el.focus(); };
  form.onsubmit = e => {
    e.preventDefault();
    const v = {};
    for (const f of o.fields) {
      const el = form.elements.namedItem(f.k);
      let x = el.value.trim();
      if (f.type === 'money') {
        if (x === '' && !f.req) x = 0;
        else { x = num(x); if (!(x >= 0) || (f.req && !(x > 0))) return fail(`${f.label}: enter an amount.`, el); }
      } else if (f.req && !x) return fail(`${f.label}: please fill in.`, el);
      v[f.k] = x;
    }
    const msg = o.save(v);
    if (typeof msg === 'string') return fail(msg);
    close();
  };
  form.onclick = e => {
    const b = e.target.closest('[data-sheet]');
    if (!b) return;
    if (b.dataset.sheet === 'close') return close();
    if (confirm(o.delAsk || 'Delete this?')) { o.del(); close(); }
  };
  box.onclick = e => { if (e.target === box) close(); };
  const first = form.querySelector('input, select');
  if (first && !first.value) first.focus();
}

function spendForm(s) {
  if (!S.categories.length) { S.tab = 'budget'; render(); return catForm(); }
  sheet({
    title: s ? 'Edit spending' : 'Add spending',
    fields: [
      { k: 'amount', label: 'Amount (RM)', type: 'money', value: s ? s.amount : '', req: true },
      { k: 'cat', label: 'Category', type: 'select', options: catsSorted().map(c => [c.id, c.name]), value: s ? s.cat : S.lastCat },
      { k: 'who', label: 'Who spent', type: 'select', options: memberOpts(), value: s ? s.who : S.me },
      { k: 'date', label: 'Date', type: 'date', value: s ? s.date : defaultDate(), req: true },
      { k: 'note', label: 'Note (optional)', type: 'text', value: s ? s.note : '', ph: 'e.g. Lotus, Shell' }
    ],
    del: s && (() => put(S.store.del('spending', s.id))),
    delAsk: 'Delete this spending?',
    save: v => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) return 'Date: pick a date.';
      const data = { amount: v.amount, cat: v.cat, who: v.who, date: v.date, month: v.date.slice(0, 7), note: v.note };
      S.lastCat = v.cat;
      put(s ? S.store.set('spending', s.id, data) : S.store.add('spending', { ...data, by: S.me, at: Date.now() }));
      if (data.month !== S.month) toast('Saved in ' + monthName(data.month));
    }
  });
}

function commitForm(c, who) {
  const m = S.month, split = !!c && c.from < m;
  sheet({
    title: c ? 'Edit commitment' : 'Add commitment',
    note: split ? `A new amount counts from ${monthName(m)}. Earlier months keep ${rm(c.amount)}.` : '',
    fields: [
      { k: 'name', label: 'What is it', type: 'text', value: c ? c.name : '', req: true, ph: 'e.g. Car loan, insurance' },
      { k: 'amount', label: 'Amount per month (RM)', type: 'money', value: c ? c.amount : '', req: true },
      { k: 'who', label: 'Who pays', type: 'select', options: memberOpts(), value: c ? c.who : who },
      ...(c ? [] : [{ k: 'from', label: 'Starts from', type: 'month', value: m, req: true }])
    ],
    del: c && (() => put(split ? S.store.set('commitments', c.id, { to: addM(m, -1) }) : S.store.del('commitments', c.id))),
    delLabel: 'Remove',
    delAsk: c && (split ? `Stop "${c.name}" from ${monthName(m)}? Earlier months keep it.` : `Remove "${c.name}"?`),
    save: v => {
      if (!c) {
        if (!/^\d{4}-\d{2}$/.test(v.from)) return 'Starts from: pick a month.';
        return void put(S.store.add('commitments', { name: v.name, amount: v.amount, who: v.who, from: v.from, to: '', at: Date.now() }));
      }
      if (split && (v.amount !== c.amount || v.who !== c.who)) {
        // changed part-way: the old one ends last month, a new one starts this month
        put(S.store.set('commitments', c.id, { to: addM(m, -1) }));
        put(S.store.add('commitments', { name: v.name, amount: v.amount, who: v.who, from: m, to: c.to || '', at: Date.now() }));
      } else put(S.store.set('commitments', c.id, { name: v.name, amount: v.amount, who: v.who }));
    }
  });
}

  'add-cat': () => catForm(),
  'edit-cat': id => { const x = find('categories', id); if (x) catForm(x); },
  'add-goal': () => goalForm(),
  'edit-goal': id => { const x = find('goals', id); if (x) goalForm(x); },
  'add-money': id => { const x = find('goals', id); if (x) moneyForm(x); },
  'del-add': id => { if (confirm('Delete this amount?')) put(S.store.del('goalAdds', id)); },
  salary: id => { const x = find('members', id); if (x) salaryForm(x); },
  'add-commit': id => commitForm(null, id),
  'edit-commit': id => { const x = find('commitments', id); if (x) commitForm(x); },
  'add-person': () => personForm(),
  'edit-person': id => { const x = find('members', id); if (x) personForm(x); },
  signin: () => S.store.signIn().catch(e => { const el = $('#signErr'); if (el) el.textContent = 'Sign-in failed: ' + (e.code || e.message); }),
  signout: () => { if (confirm('Sign out of Duit Kita on this phone?')) S.store.signOut(); },
  'signout-now': () => S.store.signOut(),
  'reset-demo': () => { if (confirm('Clear all demo data?')) S.store.reset(); },
  reload: () => location.reload()
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  const f = ACT[t.dataset.act];
  if (f) f(t.dataset.id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }
});

// ---------- start ----------
async function boot() {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.apiKey && !/PASTE/i.test(cfg.apiKey)) {
    screen('loading');
    try { S.store = await firebaseStore(cfg); }
    catch { return screen('error', 'Could not start. Check the internet and try again.'); }
  } else {
    S.store = demoStore();
    $('#banner').hidden = false;
  }
  S.store.onUser(user => {
    stopWatch();
    S.user = user;
    S.me = user ? String(user.email || '').toLowerCase() : '';
    if (!user) return screen('signin');
    screen('');
    startWatch();
    render();
  });
}
boot();
</script>
</body>
</html>
